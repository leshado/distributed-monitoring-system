global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: dms-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:9100

  - job_name: dms-scheduler
    metrics_path: /metrics
    static_configs:
      - targets:
          - scheduler:9101

  - job_name: dms-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker:9102

  - job_name: dms-incident-engine
    metrics_path: /metrics
    static_configs:
      - targets:
          - incident-engine:9103

  - job_name: dms-alert-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - alert-service:9104
